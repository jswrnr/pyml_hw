repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/srstevenson/nb-clean
    rev: 4.0.1
    hooks:
      - id: nb-clean

  - repo: local
    hooks:
      - id: nbqa-ruff
        name: nbqa ruff
        entry: nbqa ruff
        language: system
        files: \.ipynb$
        args: [--fix]

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
